-c55158fe__mono docs-svg--c55158fe__file-name docs-svg--c55158fe__text-blue" x="37.4" y="125" translate="no" lang="en">pdf/SKILL.md</text><g role="list" aria-label="文件的各部分，从上到下"><g role="listitem"><path class="docs-svg--c55158fe__box-blue" d="M36.9 257.8 V145.9 a7 7 0 0 1 7 -7 H513.5 a7 7 0 0 1 7 7 V257.8 Z"></path><foreignObject x="49.6" y="147.5" width="466.9" height="26"><div xmlns="http://www.w3.org/1999/xhtml" class="docs-svg--c55158fe__area docs-svg--c55158fe__start"><span class="docs-svg--c55158fe__label docs-svg--c55158fe__sans docs-svg--c55158fe__heading docs-svg--c55158fe__secondary">YAML Frontmatter</span></div></foreignObject><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="55.6" y="187.1" xml:space="preserve" translate="no" lang="en">---</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="55.6" y="200.5" xml:space="preserve" translate="no" lang="en">name: PDF Processing</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="55.6" y="213.9" xml:space="preserve" translate="no" lang="en">description: Comprehensive PDF toolkit for extracting text and</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="55.6" y="227.2" xml:space="preserve" translate="no" lang="en">tables, merging/splitting documents, and filling-out forms.</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="55.6" y="240.6" xml:space="preserve" translate="no" lang="en">---</text></g><g role="listitem"><path class="docs-svg--c55158fe__box-blue docs-svg--c55158fe__pale" d="M36.9 257.8 H520.5 V617.7 a7 7 0 0 1 -7 7 H43.9 a7 7 0 0 1 -7 -7 Z"></path><path class="docs-svg--c55158fe__mark-yellow" d="M383.3 361.8 H479.3 V378.7 H383.3 Z M329.5 378.7 H399.5 V395.6 H329.5 Z"></path><path class="docs-svg--c55158fe__wash-yellow" d="M383.3 361.8 H479.3 V378.7 H383.3 Z M329.5 378.7 H399.5 V395.6 H329.5 Z"></path><text class="docs-svg--c55158fe__sans docs-svg--c55158fe__heading docs-svg--c55158fe__secondary" x="55.6" y="284.7">Markdown</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="55.6" y="310.2" xml:space="preserve" translate="no" lang="en">## Overview</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="55.6" y="340.4" xml:space="preserve" translate="no" lang="en">This guide covers essential PDF processing operations using Python</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="55.6" y="357.5" xml:space="preserve" translate="no" lang="en">libraries and command-line tools. For advanced features,</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="55.6" y="374.6" xml:space="preserve" translate="no" lang="en">JavaScript libraries, and detailed examples, see ./reference.md.</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="55.6" y="391.7" xml:space="preserve" translate="no" lang="en">If you need to fill out a PDF form, read ./forms.md and follow its</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="55.6" y="408.8" xml:space="preserve" translate="no" lang="en">instructions.</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="55.6" y="435.6" xml:space="preserve" translate="no" lang="en">## Quick Start</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="55.6" y="462.4" xml:space="preserve" translate="no" lang="en">```python</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="55.6" y="475.8" xml:space="preserve" translate="no" lang="en">from pypdf import PdfReader, PdfWriter</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="55.6" y="502.5" xml:space="preserve" translate="no" lang="en"># Read a PDF</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="55.6" y="515.9" xml:space="preserve" translate="no" lang="en">reader = PdfReader("document.pdf")</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="55.6" y="529.3" xml:space="preserve" translate="no" lang="en">print(f"Pages: {len(reader.pages)}")</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="55.6" y="556" xml:space="preserve" translate="no" lang="en"># Extract text</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="55.6" y="569.4" xml:space="preserve" translate="no" lang="en">text = ""</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="55.6" y="582.8" xml:space="preserve" translate="no" lang="en">for page in reader.pages:</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="55.6" y="596.2" xml:space="preserve" translate="no" lang="en">    text += page.extract_text()</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="55.6" y="609.5" xml:space="preserve" translate="no" lang="en">```</text><g role="img" aria-label="高亮显示的路径 ./reference.md 指向文件 pdf/reference.md"><path class="docs-svg--c55158fe__arrow-yellow" d="M479.3 370.4 H538.9 a5.3 5.3 0 0 0 5.3 -5.3 V165.1 a5.3 5.3 0 0 1 5.3 -5.3 H560.8 M555.3 154.5 L560.8 159.8 L555.3 165.1"></path></g><g role="img" aria-label="高亮显示的路径 ./forms.md 指向文件 pdf/forms.md"><path class="docs-svg--c55158fe__arrow-yellow" d="M356.8 395.6 V403.4 a5.3 5.3 0 0 0 5.3 5.3 H558.5 M553.2 403.6 L558.5 408.7 L553.2 413.8"></path></g></g></g></g><g role="listitem"><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__file-name docs-svg--c55158fe__text-yellow" x="567.9" y="123.8" translate="no" lang="en">pdf/reference.md</text><g role="group" aria-label="文件内容"><rect class="docs-svg--c55158fe__box-yellow" x="570.1" y="138.8" width="415.6" height="193.2" rx="7"></rect><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="589.6" y="165.5" xml:space="preserve" translate="no" lang="en"># PDF Processing Advanced Reference</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="589.6" y="192.3" xml:space="preserve" translate="no" lang="en">This document contains advanced PDF processing features,</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="589.6" y="205.6" xml:space="preserve" translate="no" lang="en">detailed examples, and additional libraries not covered</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="589.6" y="219" xml:space="preserve" translate="no" lang="en">in the main skill instructions.</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="589.6" y="245.8" xml:space="preserve" translate="no" lang="en">## pypdfium2 Library (Apache/BSD License)</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="589.6" y="272.5" xml:space="preserve" translate="no" lang="en">### Overview</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="589.6" y="285.9" xml:space="preserve" translate="no" lang="en">pypdfium2 is a Python binding for PDFium (Chromium's PDF</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="589.6" y="299.3" xml:space="preserve" translate="no" lang="en">library). It's excellent for fast PDF rendering, image</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="589.6" y="312.6" xml:space="preserve" translate="no" lang="en">generation, and serves as ...</text></g></g><g role="listitem"><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__file-name docs-svg--c55158fe__text-yellow" x="570.4" y="371.5" translate="no" lang="en">pdf/forms.md</text><g role="group" aria-label="文件内容"><rect class="docs-svg--c55158fe__box-yellow" x="570.1" y="386" width="415.6" height="238.6" rx="7"></rect><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="589.6" y="413.2" xml:space="preserve" translate="no" lang="en">If you need to fill out a PDF form, first check to see</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="589.6" y="426.6" xml:space="preserve" translate="no" lang="en">if the PDF has fillable form fields. Run this script</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="589.6" y="440" xml:space="preserve" translate="no" lang="en">from this file's directory:</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="589.6" y="453.3" xml:space="preserve" translate="no" lang="en"> `python scripts/check_fillable_fields &lt;file.pdf&gt;`,</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="589.6" y="466.7" xml:space="preserve" translate="no" lang="en">and depending on the result go to either the "Fillable</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="589.6" y="480.1" xml:space="preserve" translate="no" lang="en">fields" or "Non-fillable fields" and follow those</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="589.6" y="493.5" xml:space="preserve" translate="no" lang="en">instructions.</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="589.6" y="520.2" xml:space="preserve" translate="no" lang="en"># Fillable fields</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="589.6" y="533.6" xml:space="preserve" translate="no" lang="en">If the PDF has fillable form fields:</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="589.6" y="547" xml:space="preserve" translate="no" lang="en">- Run this script from this file's directory:</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="589.6" y="560.3" xml:space="preserve" translate="no" lang="en">`python scripts/extract_form_field_info.py &lt;input.pdf&gt;</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="589.6" y="573.7" xml:space="preserve" translate="no" lang="en">&lt;fields.json&gt;`.</text><text class="docs-svg--c55158fe__mono docs-svg--c55158fe__code docs-svg--c55158fe__secondary" x="589.6" y="587.1" xml:space="preserve" translate="no" lang="en">...</text></g></g></g></svg>