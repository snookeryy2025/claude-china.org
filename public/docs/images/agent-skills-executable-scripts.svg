has fillable form</text><text class="docs-svg--31cf2490__mono docs-svg--31cf2490__code docs-svg--31cf2490__secondary" x="55.5" y="360.2" xml:space="preserve" translate="no" lang="en">fields:</text><text class="docs-svg--31cf2490__mono docs-svg--31cf2490__code docs-svg--31cf2490__secondary" x="55.5" y="377.3" xml:space="preserve" translate="no" lang="en">- Run this script from this file's directory:</text><text class="docs-svg--31cf2490__mono docs-svg--31cf2490__code docs-svg--31cf2490__secondary" x="55.5" y="394.4" xml:space="preserve" translate="no" lang="en">`python ./extract_fields.py</text><text class="docs-svg--31cf2490__mono docs-svg--31cf2490__code docs-svg--31cf2490__secondary" x="55.5" y="411.5" xml:space="preserve" translate="no" lang="en">&lt;input.pdf&gt; &lt;fields.json&gt;`.</text><text class="docs-svg--31cf2490__mono docs-svg--31cf2490__code docs-svg--31cf2490__secondary" x="55.5" y="428.7" xml:space="preserve" translate="no" lang="en">...</text></g><g role="img" aria-label="高亮显示的路径 ./extract_fields.py 指向文件 pdf/extract_fields.py"><path class="docs-svg--31cf2490__arrow-violet" d="M239.8 391.1 H436.5 a5.3 5.3 0 0 0 5.3 -5.3 V189.8 a5.3 5.3 0 0 1 5.3 -5.3 H459.3 M453.8 179 L459.3 184.5 L453.8 190"></path></g></g><g role="listitem"><text class="docs-svg--31cf2490__mono docs-svg--31cf2490__file-name docs-svg--31cf2490__text-violet" x="465.4" y="126" translate="no" lang="en">pdf/extract_fields.py</text><g role="group" aria-label="文件内容"><rect class="docs-svg--31cf2490__box-violet" x="465.1" y="144.5" width="513.1" height="358.4" rx="7"></rect><text class="docs-svg--31cf2490__mono docs-svg--31cf2490__code docs-svg--31cf2490__secondary" x="484" y="188.9" xml:space="preserve" translate="no" lang="en">from pypdf import PdfReader</text><text class="docs-svg--31cf2490__mono docs-svg--31cf2490__code docs-svg--31cf2490__secondary" x="484" y="223.2" xml:space="preserve" translate="no" lang="en">def write_field_info(pdf_path: str, output_path: str):</text><text class=