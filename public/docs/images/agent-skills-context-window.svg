<svg lang="en" width="1024" height="577" viewBox="0 0 1024 577" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Skills loading into context window - showing the progressive loading of skill metadata and content">
  <style>
    /* Type: the page's fonts when the page inlines this diagram; the listed fallbacks otherwise, for example in a code review */
    .sans { font-family: var(--cds-font-sans, "Anthropic Sans", system-ui, -apple-system, "PingFang SC", "PingFang TC", "Hiragino Sans", "Apple SD Gothic Neo", sans-serif); font-size: 11.2px; }
    .mono { font-family: var(--cds-font-mono, "Anthropic Mono", ui-monospace, SFMono-Regular, Menlo, monospace); font-size: 11.2px; }
    .middle { text-anchor: middle; }
    /* Bold text sets its weight axis too: in dark mode the page sets "wght" 360, which this text inherits and which overrides font-weight */
    .bold { font-weight: 600; font-variation-settings: var(--cds-font-wght-bold, normal); }
    .title { font-size: 35.4px; }
    .heading { font-size: 16.8px; }
    /* Colors: the docs theme's CSS variables when the page inlines this diagram; the light values otherwise */
    .canvas { fill: var(--cds-surface-1, #fcfcfb); }
    .panel { fill: var(--cds-surface-2, #ffffff); stroke: var(--cds-border, #e4e4e3); stroke-width: 1; }
    .primary { fill: var(--cds-text-primary, #0b0b0b); }
    .secondary { fill: var(--cds-text-secondary, #52514e); }
    .window { fill: var(--cds-surface-3, #ffffff); }
    .window-top { fill: var(--cds-bg-neutral, #f3f3f3); }
    .outline { fill: none; stroke: var(--cds-text-secondary, #52514e); stroke-width: 1.25; }
    .box-gray { fill: var(--cds-bg-neutral, #f3f3f3); stroke: var(--cds-text-secondary, #52514e); stroke-width: 1.25; }
    .box-blue-pale { fill: var(--cds-bg-accent, #cde2fb); fill-opacity: 0.5; stroke: var(--cds-fill-accent, #2a78d6); stroke-width: 1.25; }
    .box-yellow { fill: var(--cds-bg-tint-yellow-opaque, #f9dca4); fill-opacity: 0.3; stroke: var(--cds-fill-warning, #fab219); stroke-opacity: 0.75; stroke-width: 1.25; }
    .box-green { fill: var(--cds-bg-success, #caeac7); fill-opacity: 0.5; stroke: var(--cds-fill-success, #009300); stroke-width: 1.25; }
    .arrow { fill: none; stroke: var(--cds-fill-success, #009300); stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
    /* Labels are HTML text in an area, so that a longer translation wraps inside it */
    :where(foreignObject) { overflow: visible; }
    .area { box-sizing: border-box; width: 100%; height: 100%; display: flex; align-items: center; padding: 4px 6px; }
    .area.center { justify-content: center; text-align: center; }
    .area.start { justify-content: flex-start; text-align: start; }
    .area.top { align-items: flex-start; }
    .area.bottom { align-items: flex-end; }
    /* In English, the text in the two boxes on the right starts 19.6 or 14.8 units from the left edge of its box. A translation is centred in its box. */
    .area.en-start-20:lang(en), .area.en-start-15:lang(en) { justify-content: flex-start; text-align: start; }
    .area.en-start-20:lang(en) { padding-left: 19.6px; }
    /* Translations in these two boxes keep about the side gap of the English text */
    .area.en-start-20:not(:lang(en)), .area.en-start-15:not(:lang(en)) { padding-left: 14px; padding-right: 14px; }
    .area.en-start-15:lang(en) { padding-left: 14.8px; }
    .label { line-height: 1.3; overflow-wrap: anywhere; }
    /* Only translations hyphenate, and only words of 10 or more letters, with 5 on each side of the hyphen. They also try to avoid a single word on their last line. A translated copy has its language on the root. */
    .label:not(:lang(en)) { hyphens: auto; hyphenate-limit-chars: 10 5 5; -webkit-hyphenate-limit-before: 5; -webkit-hyphenate-limit-after: 5; }
    .label:not(:lang(en)):not(.balance) { text-wrap: pretty; }
    /* Firefox has no text-wrap: pretty. There a translation balances its lines instead, which also keeps a single word off its last line, and has no automatic hyphens. */
    @supports not (text-wrap: pretty) { .label:not(:lang(en)) { hyphens: manual; } .label:not(:lang(en)):not(.balance) { text-wrap: balance; } }
    /* A translated label with lines of about the same length; the English label keeps its own line breaks */
    .label.balance-translation:not(:lang(en)) { text-wrap: balance; }
    .label .mono, .label .code { hyphens: none; overflow-wrap: normal; }
    /* Chinese, Japanese and Korean labels break lines only at spaces and punctuation, and at the zero-width spaces that the docs translator adds to Chinese and Japanese text */
    .label:is(:lang(ja), :lang(ko), :lang(zh)) { word-break: keep-all; }
    /* Chinese, Japanese and Korean fonts have no italics, so the browser would slant the glyphs. This overrides the diagram's italic classes. */
    :is(:lang(ja), :lang(ko), :lang(zh)) { font-style: normal !important; }
    .label.primary { color: var(--cds-text-primary, #0b0b0b); }
    .label.secondary { color: var(--cds-text-secondary, #52514e); }
    /* Line heights of labels whose lines were drawn closer or farther apart than 1.3 (lh-N is N/100) */
    .lh-121 { line-height: 1.21; }
    /* On a label: lines of about the same length */
    .balance { text-wrap: balance; }
  </style>
  <g aria-hidden="true">
    <rect class="canvas" width="1024" height="577"/>
    <rect class="panel" x="18.5" y="90" width="985.5" height="468" rx="16"/>
  </g>
  <foreignObject x="18.5" y="18.51" width="986" height="67.51">
    <div xmlns="http://www.w3.org/1999/xhtml" class="area center top">
      <span class="label sans bold title primary">Skills and the context window</span>
    </div>
  </foreignObject>
  <g role="list" aria-label="Context window, from top to bottom">
    <!-- The heading is the list's label, so it is hidden from screen readers and not read twice -->
    <g aria-hidden="true">
      <foreignObject x="232" y="94.41" width="768" height="30.02">
        <div xmlns="http://www.w3.org/1999/xhtml" class="area start bottom">
          <span class="label sans bold heading secondary">Context window</span>
        </div>
      </foreignObject>
      <rect class="window" x="238.2" y="127.4" width="545.5" height="412.9" rx="7"/>
      <path class="window-top" d="M238.2 248.9 V134.4 a7 7 0 0 1 7 -7 H776.7 a7 7 0 0 1 7 7 V248.9 Z"/>
      <rect class="outline" x="238.2" y="127.4" width="545.5" height="412.9" rx="7"/>
      <path class="outline" d="M238.2 248.9 H783.7"/>
    </g>
    <g role="listitem">
      <g role="list" aria-label="System prompt">
        <g role="listitem">
          <rect class="box-blue-pale" x="265.9" y="145.8" width="486.3" height="37.2" rx="4"/>
          <text class="mono secondary" x="283" y="166.8" xml:space="preserve" translate="no">&lt;...contents of the agent’s core system prompt...&gt;</text>
        </g>
        <g role="listitem">
          <g role="note">
            <rect class="box-green" x="36.5" y="184.4" width="184.8" height="65.1" rx="4"/>
            <foreignObject x="46.5" y="184.4" width="174.8" height="65.1">
              <div xmlns="http://www.w3.org/1999/xhtml" class="area start">
                <span class="label sans bold secondary lh-121 balance">Short snippets from each Skill appended to the system prompt</span>
              </div>
            </foreignObject>
            <path class="arrow" role="img" aria-label="Describes the Skill snippets that follow" d="M221.3 215 H259.5 M253.5 209.2 L259.5 215 L253.5 220.8"/>
          </g>
          <g role="list" aria-label="Skills">
            <g role="listitem">
              <rect class="box-blue-pale" x="266" y="201.1" width="72" height="27.9" rx="4"/>
              <text class="mono secondary middle" x="300.9" y="218.5" translate="no">bigquery</text>
            </g>
            <g role="listitem">
              <rect class="box-blue-pale" x="346.9" y="201.1" width="45.8" height="27.9" rx="4"/>
              <text class="mono secondary middle" x="369.5" y="218.5" translate="no">docx</text>
            </g>
            <g role="listitem">
              <rect class="box-blue-pale" x="402" y="201.1" width="84.4" height="27.9" rx="4"/>
              <text class="mono secondary middle" x="443.2" y="218.5" translate="no">nda-review</text>
            </g>
            <g role="listitem">
              <rect class="box-blue-pale" x="494.9" y="201.1" width="39.1" height="27.9" rx="4"/>
              <text class="mono secondary middle" x="513.5" y="218.5" translate="no">pdf</text>
            </g>
            <g role="listitem">
              <rect class="box-blue-pale" x="542.4" y="201.1" width="46.8" height="27.9" rx="4"/>
              <text class="mono secondary middle" x="565.2" y="218.5" translate="no">pptx</text>
            </g>
            <g role="listitem">
              <rect class="box-blue-pale" role="img" aria-label="and more" x="597.6" y="201.1" width="34.9" height="27.9" rx="4"/>
              <text class="mono secondary middle" aria-hidden="true" x="614.4" y="218.5" translate="no">...</text>
            </g>
            <g role="listitem">
              <rect class="box-blue-pale" x="640.6" y="201.1" width="45.1" height="27.9" rx="4"/>
              <text class="mono secondary middle" x="662.8" y="218.5" translate="no">xlsx</text>
            </g>
          </g>
        </g>
      </g>
    </g>
    <g role="listitem">
      <g role="list" aria-label="Conversation, in order">
        <g role="listitem">
          <g role="note">
            <rect class="box-green" x="36.5" y="273" width="184.8" height="37.2" rx="4"/>
            <foreignObject x="36.5" y="273" width="184.8" height="37.2">
              <div xmlns="http://www.w3.org/1999/xhtml" class="area center">
                <span class="label sans bold secondary lh-121">Initial message from user</span>
              </div>
            </foreignObject>
            <path class="arrow" role="img" aria-label="Describes the message that follows" d="M221.3 291.5 H259.5 M253.5 285.7 L259.5 291.5 L253.5 297.3"/>
          </g>
          <rect class="box-gray" x="265.6" y="266.7" width="398" height="50.2" rx="4"/>
          <text class="mono secondary" x="279" y="287.5" xml:space="preserve" translate="no">User: Fill out this PDF based on what you know about me</text>
          <text class="mono secondary" x="279" y="300.5" xml:space="preserve" translate="no">Attached: /mnt/uploads/order_form.pdf</text>
        </g>
        <g role="listitem">
          <g role="note">
            <rect class="box-green" x="800.7" y="333.9" width="184.8" height="50" rx="4"/>
            <foreignObject x="800.7" y="333.9" width="184.8" height="50">
              <div xmlns="http://www.w3.org/1999/xhtml" class="area center en-start-20">
                <span class="label sans bold secondary lh-121 balance-translation">Claude decides to “trigger” the PDF Skill by reading it</span>
              </div>
            </foreignObject>
            <path class="arrow" role="img" aria-label="Describes the message that follows" d="M800.7 359 H762.2 M768.4 353.1 L762.2 359 L768.4 364.9"/>
          </g>
          <rect class="box-gray" x="398.9" y="334" width="357.7" height="50.1" rx="4"/>
          <text class="mono secondary" x="413.5" y="355.5" xml:space="preserve" translate="no">Claude: Certainly! I’ll use the PDF Skill to help</text>
          <text class="mono secondary" x="413.5" y="368.5" xml:space="preserve" translate="no">Tool use: Bash (”cat /mnt/skills/pdf/SKILL.md”)</text>
        </g>
        <g role="listitem">
          <rect class="box-blue-pale" x="329.8" y="387.9" width="426.7" height="37.3" rx="4"/>
          <text class="mono secondary" x="342" y="409" xml:space="preserve" translate="no">Tool result: {stdout: “...contents of the SKILL.md file...”}</text>
        </g>
        <g role="listitem">
          <g role="note">
            <rect class="box-green" x="800.6" y="428" width="184.9" height="65.1" rx="4"/>
            <foreignObject x="800.6" y="428" width="184.9" height="65.1">
              <div xmlns="http://www.w3.org/1999/xhtml" class="area center en-start-15">
                <span class="label sans bold secondary lh-121 balance-translation">Claude decides to follow the reference from the SKILL.md to the forms.md file</span>
              </div>
            </foreignObject>
            <path class="arrow" role="img" aria-label="Describes the tool use that follows" d="M800.6 460.5 H762.2 M768.4 454.6 L762.2 460.5 L768.4 466.4"/>
          </g>
          <rect class="box-yellow" x="398" y="442.1" width="358.3" height="37.1" rx="4"/>
          <text class="mono secondary" x="413" y="465" xml:space="preserve" translate="no">Tool use: Bash (”cat /mnt/skills/pdf/forms.md”)</text>
        </g>
        <g role="listitem">
          <rect class="box-blue-pale" x="329.7" y="483.4" width="426.7" height="37.4" rx="4"/>
          <text class="mono secondary" x="342" y="504.5" xml:space="preserve" translate="no">Tool result: {stdout: “...contents of the forms.md file...”}</text>
        </g>
      </g>
    </g>
  </g>
</svg>
