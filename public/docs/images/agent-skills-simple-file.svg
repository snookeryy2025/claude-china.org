L Frontmatter</span></div></foreignObject><text class="docs-svg--ddabcf8b__mono docs-svg--ddabcf8b__code docs-svg--ddabcf8b__secondary" x="55.6" y="184.2" xml:space="preserve" translate="no" lang="en">---</text><text class="docs-svg--ddabcf8b__mono docs-svg--ddabcf8b__code docs-svg--ddabcf8b__secondary" x="55.6" y="197.6" xml:space="preserve" translate="no" lang="en">name: PDF Processing</text><text class="docs-svg--ddabcf8b__mono docs-svg--ddabcf8b__code docs-svg--ddabcf8b__secondary" x="55.6" y="210.9" xml:space="preserve" translate="no" lang="en">description: Comprehensive PDF toolkit for extracting text and tables, merging/splitting documents, and filling-out forms.</text><text class="docs-svg--ddabcf8b__mono docs-svg--ddabcf8b__code docs-svg--ddabcf8b__secondary" x="55.6" y="224.3" xml:space="preserve" translate="no" lang="en">---</text></g><g role="listitem"><path class="docs-svg--ddabcf8b__box-blue docs-svg--ddabcf8b__pale" d="M36.9 239.8 H985.7 V531.8 a7 7 0 0 1 -7 7 H43.9 a7 7 0 0 1 -7 -7 Z"></path><text class="docs-svg--ddabcf8b__sans docs-svg--ddabcf8b__heading docs-svg--ddabcf8b__secondary" x="55.6" y="267">Markdown</text><text class="docs-svg--ddabcf8b__mono docs-svg--ddabcf8b__code docs-svg--ddabcf8b__secondary" x="55.6" y="292.5" xml:space="preserve" translate="no" lang="en">## Overview</text><text class="docs-svg--ddabcf8b__mono docs-svg--ddabcf8b__code docs-svg--ddabcf8b__secondary" x="55.6" y="319.2" xml:space="preserve" translate="no" lang="en">This guide covers essential PDF processing operations using Python libraries and command-line tools. For advanced features, JavaScript</text><text class="docs-svg--ddabcf8b__mono docs-svg--ddabcf8b__code docs-svg--ddabcf8b__secondary" x="55.6" y="332.6" xml:space="preserve" translate="no" lang="en">libraries, and detailed examples, see ./reference.md. If you need to fill out a PDF form, read ./forms.md and follow its instructions.</text><text class="docs-svg--ddabcf8b__mono docs-svg--ddabcf8b__code docs-svg--ddabcf8b__secondary" x="55.6" y="359.4" xml:space="preserve" translate="no" lang="en">## Quick Start</text><text class="docs-svg--ddabcf8b__mono docs-svg--ddabcf8b__code docs-svg--ddabcf8b__secondary" x="55.6" y="386.1" xml:space="preserve" translate="no" lang="en">```python</text><text class="docs-svg--ddabcf8b__mono docs-svg--ddabcf8b__code docs-svg--ddabcf8b__secondary" x="55.6" y="399.5" xml:space="preserve" translate="no" lang="en">from pypdf import PdfReader, PdfWriter</text><text class="docs-svg--ddabcf8b__mono docs-svg--ddabcf8b__code docs-svg--ddabcf8b__secondary" x="55.6" y="426.2" xml:space="preserve" translate="no" lang="en"># Read a PDF</text><text class="docs-svg--ddabcf8b__mono docs-svg--ddabcf8b__code docs-svg--ddabcf8b__secondary" x="55.6" y="439.6" xml:space="preserve" translate="no" lang="en">reader = PdfReader("document.pdf")</text><text class="docs-svg--ddabcf8b__mono docs-svg--ddabcf8b__code docs-svg--ddabcf8b__secondary" x="55.6" y="452.9" xml:space="preserve" translate="no" lang="en">print(f"Pages: {len(reader.pages)}")</text><text class="docs-svg--ddabcf8b__mono docs-svg--ddabcf8b__code docs-svg--ddabcf8b__secondary" x="55.6" y="479.7" xml:space="preserve" translate="no" lang="en"># Extract text</text><text class="docs-svg--ddabcf8b__mono docs-svg--ddabcf8b__code docs-svg--ddabcf8b__secondary" x="55.6" y="493.1" xml:space="preserve" translate="no" lang="en">text = ""</text><text class="docs-svg--ddabcf8b__mono docs-svg--ddabcf8b__code docs-svg--ddabcf8b__secondary" x="55.6" y="506.4" xml:space="preserve" translate="no" lang="en">for page in reader.pages:</text><text class="docs-svg--ddabcf8b__mono docs-svg--ddabcf8b__code docs-svg--ddabcf8b__secondary" x="55.6" y="519.8" xml:space="preserve" translate="no" lang="en">    text += page.extract_text()</text><text class="docs-svg--ddabcf8b__mono docs-svg--ddabcf8b__code docs-svg--ddabcf8b__secondary" x="55.6" y="533.2" xml:space="preserve" translate="no" lang="en">```</text></g></g></g></svg>