<svg lang="en" width="1199" height="622" viewBox="0 0 1199 622" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Diagram of the orchestrator strategy: a frontier model fans subtasks out to three lower-cost worker models">
  <style>
    /* Type: the page's serif font when the page inlines this diagram; the listed fallbacks otherwise, for example in a code review */
    .serif { font-family: var(--cds-font-voice, "Anthropic Serif", ui-serif, Georgia, "Times New Roman", serif); }
    /* Chinese, Japanese and Korean have no serif in the docs fonts, and browsers pick different serif fallbacks for them, so their serif labels use the sans fonts, like the page's sans text */
    .serif:is(:lang(ja), :lang(ko), :lang(zh)) { font-family: var(--cds-font-sans, "Anthropic Sans", system-ui, -apple-system, "PingFang SC", "PingFang TC", "Hiragino Sans", "Apple SD Gothic Neo", sans-serif); }
    .middle { text-anchor: middle; }
    .italic { font-style: italic; }
    /* The titles are heavier than the CDS bold (600), as in the picture this diagram replaces. They set the weight axis too: in dark mode the page sets "wght" 360, which this text inherits and which overrides font-weight */
    .title { font-weight: 700; font-variation-settings: "wght" 700; letter-spacing: -0.01em; }
    /* Colors: the docs theme's CSS variables when the page inlines this diagram; the light values otherwise */
    .canvas { fill: var(--cds-surface-1, #fcfcfb); }
    .primary { fill: var(--cds-text-primary, #0b0b0b); }
    .secondary { fill: var(--cds-text-secondary, #52514e); }
    .orange { fill: var(--cds-text-tint-orange, #863311); }
    .box { fill: var(--cds-surface-2, #ffffff); stroke: var(--cds-text-primary, #0b0b0b); stroke-width: 1.7; }
    /* The orchestrator's box is clay in both themes, so the text on it is dark in both */
    .box-clay { fill: var(--cds-clay, #d97757); stroke: var(--cds-text-primary, #0b0b0b); stroke-width: 2.2; stroke-dasharray: 4.9 2.4; }
    .on-clay { fill: var(--cds-gray-900, #0b0b0b); }
    /* Dark text keeps its drawn weight: the page's dark-mode "wght" 360 is for light text on dark */
    .drawn-weight { font-variation-settings: normal; }
    .line { fill: none; stroke-width: 2.6; }
    .line-thin { stroke-width: 1.8; }
    .line-primary { stroke: var(--cds-text-primary, #0b0b0b); }
    .line-orange { stroke: var(--cds-text-tint-orange, #863311); }
    /* Labels are HTML text in an area, so that a longer translation wraps inside it */
    :where(foreignObject) { overflow: visible; }
    .area { box-sizing: border-box; width: 100%; height: 100%; display: flex; align-items: center; padding: 4px 6px; }
    .area.center { justify-content: center; text-align: center; }
    .area.start { justify-content: flex-start; text-align: start; }
    .area.end { justify-content: flex-end; text-align: end; }
    .area.top { align-items: flex-start; }
    .area.bottom { align-items: flex-end; }
    /* No padding above a title that sits at the bottom of its area, so that a translation that wraps to two lines has room above; the English does not move */
    .area.pad-top-0 { padding-top: 0; }
    .label { line-height: 1.3; overflow-wrap: anywhere; }
    /* Only translations hyphenate, and only words of 10 or more letters, with 5 on each side of the hyphen. They also try to avoid a single word on their last line. A translated copy has its language on the root. */
    .label:not(:lang(en)) { hyphens: auto; hyphenate-limit-chars: 10 5 5; -webkit-hyphenate-limit-before: 5; -webkit-hyphenate-limit-after: 5; }
    .label:not(:lang(en)):not(.balance) { text-wrap: pretty; }
    /* Firefox has no text-wrap: pretty. There a translation balances its lines instead, which also keeps a single word off its last line, and has no automatic hyphens. */
    @supports not (text-wrap: pretty) { .label:not(:lang(en)) { hyphens: manual; } .label:not(:lang(en)):not(.balance) { text-wrap: balance; } }
    .label .mono, .label .code { hyphens: none; overflow-wrap: normal; }
    /* Chinese, Japanese and Korean labels break lines only at spaces and punctuation, and at the zero-width spaces that the docs translator adds to Chinese and Japanese text */
    .label:is(:lang(ja), :lang(ko), :lang(zh)) { word-break: keep-all; }
    /* Chinese, Japanese and Korean fonts have no italics, so the browser would slant the glyphs. This overrides the diagram's italic classes. */
    :is(:lang(ja), :lang(ko), :lang(zh)) { font-style: normal !important; }
    .fs-17-4 { font-size: 17.4px; }
    .fs-17-9 { font-size: 17.9px; }
    .fs-21-2 { font-size: 21.2px; }
    .fs-21-4 { font-size: 21.4px; }
    .fs-25-3 { font-size: 25.3px; }
    .fs-40-1 { font-size: 40.1px; }
    .label.primary { color: var(--cds-text-primary, #0b0b0b); }
    .label.secondary { color: var(--cds-text-secondary, #52514e); }
    .label.orange { color: var(--cds-text-tint-orange, #863311); }
    .label.on-clay { color: var(--cds-gray-900, #0b0b0b); }
  </style>
  <rect class="canvas" width="1199" height="622" aria-hidden="true"/>
  <g role="list" aria-label="Models">
    <g role="listitem">
      <rect class="box-clay" x="123.3" y="210" width="418" height="248" rx="20"/>
      <foreignObject x="127.3" y="214" width="410" height="111.1">
        <div xmlns="http://www.w3.org/1999/xhtml" class="area center bottom pad-top-0">
          <span class="label serif title fs-40-1 on-clay">Orchestrator</span>
        </div>
      </foreignObject>
      <text class="serif middle italic on-clay drawn-weight" x="334" y="349" font-size="24">Frontier model</text>
      <foreignObject x="128.7" y="371.7" width="408.6" height="82.3">
        <div xmlns="http://www.w3.org/1999/xhtml" class="area center top">
          <span class="label serif italic on-clay drawn-weight fs-17-4">Plan</span>
        </div>
      </foreignObject>
    </g>
    <g role="listitem">
      <rect class="box" x="789.9" y="86.3" width="247.3" height="133" rx="16"/>
      <foreignObject x="793.9" y="90.3" width="239.2" height="69.6">
        <div xmlns="http://www.w3.org/1999/xhtml" class="area center bottom">
          <span class="label serif title fs-25-3 primary">Worker 1</span>
        </div>
      </foreignObject>
      <text class="serif middle italic primary" x="914.5" y="177.5" font-size="18.3">Lower-cost model</text>
    </g>
    <g role="listitem">
      <rect class="box" x="789.9" y="266.8" width="247.3" height="133" rx="16"/>
      <foreignObject x="793.9" y="270.8" width="239.2" height="69.6">
        <div xmlns="http://www.w3.org/1999/xhtml" class="area center bottom">
          <span class="label serif title fs-25-3 primary">Worker 2</span>
        </div>
      </foreignObject>
      <text class="serif middle italic primary" x="914.5" y="358" font-size="18.3">Lower-cost model</text>
    </g>
    <g role="listitem">
      <rect class="box" x="789.9" y="447.3" width="247.3" height="133" rx="16"/>
      <foreignObject x="793.9" y="451.3" width="239.2" height="69.6">
        <div xmlns="http://www.w3.org/1999/xhtml" class="area center bottom">
          <span class="label serif title fs-25-3 primary">Worker 3</span>
        </div>
      </foreignObject>
      <text class="serif middle italic primary" x="914.5" y="538.5" font-size="18.3">Lower-cost model</text>
    </g>
  </g>
  <!-- Each set of arrows tells a screen reader what it means, after its label -->
  <g role="list" aria-label="How they work together">
    <g role="listitem">
      <foreignObject x="0" y="479.5" width="170" height="138.5">
        <div xmlns="http://www.w3.org/1999/xhtml" class="area center top">
          <span class="label serif italic fs-21-2 secondary">Main loop</span>
        </div>
      </foreignObject>
      <g role="img" aria-label="The orchestrator runs the main loop">
        <path class="line line-primary" d="M123.5 247.5 C25.9 215.1 -6.9 397.6 88 441"/>
        <path class="primary" d="M89 431.9 L110 446.3 L85.6 453.8 Z"/>
      </g>
    </g>
    <g role="listitem">
      <foreignObject x="545.3" y="283" width="207.7" height="44.4">
        <div xmlns="http://www.w3.org/1999/xhtml" class="area center bottom">
          <span class="label serif italic fs-21-4 orange">Fan out</span>
        </div>
      </foreignObject>
      <g role="img" aria-label="The orchestrator hands work to each of the three workers">
        <path class="line line-orange" d="M541.3 258.1 L760 167.5"/>
        <path class="orange" d="M754.8 158.1 L780 159.5 L763.4 178.1 Z"/>
        <path class="line line-orange" d="M541.3 331.5 H758"/>
        <path class="orange" d="M757 320.5 L780 331.5 L757 342.5 Z"/>
        <path class="line line-orange" d="M541.3 404.9 L760 495.5"/>
        <path class="orange" d="M754.8 504.9 L780 503.5 L763.4 484.9 Z"/>
      </g>
    </g>
    <g role="listitem">
      <foreignObject x="1044" y="4" width="151" height="84.1">
        <div xmlns="http://www.w3.org/1999/xhtml" class="area center bottom">
          <span class="label serif italic fs-17-9 secondary">Worker loop</span>
        </div>
      </foreignObject>
      <g role="img" aria-label="Each worker runs its own loop">
        <path class="line line-thin line-primary" d="M1042 127 C1118.9 104.5 1123.7 188 1056.3 180.3"/>
        <path class="primary" d="M1041 178.3 L1058.7 174.5 L1054.7 189 Z"/>
        <path class="line line-thin line-primary" d="M1042 307 C1118.9 284.5 1123.7 368 1056.3 360.3"/>
        <path class="primary" d="M1041 358.3 L1058.7 354.5 L1054.7 369 Z"/>
        <path class="line line-thin line-primary" d="M1042 487 C1118.9 464.5 1123.7 548 1056.3 540.3"/>
        <path class="primary" d="M1041 538.3 L1058.7 534.5 L1054.7 549 Z"/>
      </g>
    </g>
  </g>
</svg>
