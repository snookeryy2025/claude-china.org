<svg lang="en" width="830" height="218" viewBox="0 0 830 218" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="On-demand compaction: a request that carries four messages and the compaction parameter returns one compaction block and no reply; on the next request the block comes first in messages in place of those four messages, followed by the next user turn">
  <style>
    .sans { font-family: var(--cds-font-sans, "Anthropic Sans", system-ui, -apple-system, "PingFang SC", "PingFang TC", "Hiragino Sans", "Apple SD Gothic Neo", sans-serif); }
    /* Colors: the docs theme's CSS variables when the page inlines this diagram; the light values otherwise */
    .canvas { fill: var(--cds-surface-1, #fcfcfb); }
    .box { fill: var(--cds-surface-2, #ffffff); stroke: var(--cds-border-stronger, #9c9c9b); stroke-width: 1.5; }
    .box-shaded { fill: var(--cds-alpha-2, #e4e4e3); stroke: var(--cds-border-stronger, #9c9c9b); stroke-width: 1.5; }
    .arrow { fill: none; stroke: var(--cds-text-secondary, #52514e); stroke-width: 1.5; }
    .arrow-head { fill: var(--cds-text-secondary, #52514e); }
    /* Labels are HTML text in an area, so that a longer translation wraps inside it */
    :where(foreignObject) { overflow: visible; }
    .area { box-sizing: border-box; width: 100%; height: 100%; display: flex; align-items: center; padding: 4px 6px; }
    .area.center { justify-content: center; text-align: center; }
    .area.start { justify-content: flex-start; text-align: start; }
    .area.top { align-items: flex-start; }
    .area.bottom { align-items: flex-end; }
    .label { line-height: 1.3; overflow-wrap: anywhere; }
    /* Only translations hyphenate, and only words of 10 or more letters, with 5 on each side of the hyphen. They also try to avoid a single word on their last line. A translated copy has its language on the root. */
    .label:not(:lang(en)) { hyphens: auto; hyphenate-limit-chars: 10 5 5; -webkit-hyphenate-limit-before: 5; -webkit-hyphenate-limit-after: 5; }
    .label:not(:lang(en)):not(.balance) { text-wrap: pretty; }
    /* Firefox has no text-wrap: pretty. There a translation balances its lines instead, which also keeps a single word off its last line, and has no automatic hyphens. */
    @supports not (text-wrap: pretty) { .label:not(:lang(en)) { hyphens: manual; } .label:not(:lang(en)):not(.balance) { text-wrap: balance; } }
    .label .mono, .label .code { hyphens: none; overflow-wrap: normal; }
    /* Chinese, Japanese and Korean labels break lines only at spaces and punctuation, and at the zero-width spaces that the docs translator adds to Chinese and Japanese text */
    .label:is(:lang(ja), :lang(ko), :lang(zh)) { word-break: keep-all; }
    /* Chinese, Japanese and Korean fonts have no italics, so the browser would slant the glyphs. This overrides the diagram's italic classes. */
    :is(:lang(ja), :lang(ko), :lang(zh)) { font-style: normal !important; }
    /* Sizes, weights and colors, from the attributes the labels had as SVG text */
    .size-10 { font-size: 10px; }
    .size-11 { font-size: 11px; }
    .size-11-5 { font-size: 11.5px; }
    /* Bold text sets its weight axis too: in dark mode the page sets "wght" 360, which this text inherits and which overrides font-weight */
    .weight-600 { font-weight: 600; font-variation-settings: var(--cds-font-wght-bold, normal); }
    .italic { font-style: italic; }
    .label.primary { color: var(--cds-text-primary, #0b0b0b); }
    .label.secondary { color: var(--cds-text-secondary, #52514e); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 6" markerWidth="10" markerHeight="6" refX="10" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <polygon class="arrow-head" points="0 0, 10 3, 0 6"/>
    </marker>
  </defs>
  <rect class="canvas" width="830" height="218" rx="6" aria-hidden="true"/>
  <g role="list" aria-label="Two requests and the response between them">
    <g role="listitem">
      <foreignObject x="14" y="0" width="182" height="41.48">
        <div xmlns="http://www.w3.org/1999/xhtml" class="area start bottom">
          <span class="label sans size-11-5 weight-600 primary">Compaction request</span>
        </div>
      </foreignObject>
      <foreignObject x="14" y="35.5" width="182" height="55.5">
        <div xmlns="http://www.w3.org/1999/xhtml" class="area start top">
          <span class="label sans size-10 italic secondary">four messages</span>
        </div>
      </foreignObject>
      <g role="list" aria-label="Messages of the compaction request">
        <g role="listitem">
          <rect class="box" x="200" y="20" width="58" height="34" rx="5"/>
          <foreignObject x="200" y="20" width="58" height="34">
            <div xmlns="http://www.w3.org/1999/xhtml" class="area center">
              <span class="label sans size-11 primary" translate="no">user 1</span>
            </div>
          </foreignObject>
        </g>
        <g role="listitem">
          <rect class="box" x="266" y="20" width="58" height="34" rx="5"/>
          <foreignObject x="266" y="20" width="58" height="34">
            <div xmlns="http://www.w3.org/1999/xhtml" class="area center">
              <span class="label sans size-11 primary" translate="no">asst 1</span>
            </div>
          </foreignObject>
        </g>
        <g role="listitem">
          <rect class="box" x="332" y="20" width="58" height="34" rx="5"/>
          <foreignObject x="332" y="20" width="58" height="34">
            <div xmlns="http://www.w3.org/1999/xhtml" class="area center">
              <span class="label sans size-11 primary" translate="no">user 2</span>
            </div>
          </foreignObject>
        </g>
        <g role="listitem">
          <rect class="box" x="398" y="20" width="58" height="34" rx="5"/>
          <foreignObject x="398" y="20" width="58" height="34">
            <div xmlns="http://www.w3.org/1999/xhtml" class="area center">
              <span class="label sans size-11 primary" translate="no">asst 2</span>
            </div>
          </foreignObject>
        </g>
      </g>
    </g>
    <g role="listitem">
      <foreignObject x="14" y="56.5" width="182" height="56.97">
        <div xmlns="http://www.w3.org/1999/xhtml" class="area start bottom">
          <span class="label sans size-11-5 weight-600 primary">Response</span>
        </div>
      </foreignObject>
      <foreignObject x="14" y="107.5" width="182" height="55.5">
        <div xmlns="http://www.w3.org/1999/xhtml" class="area start top">
          <span class="label sans size-10 italic secondary">one block, no reply</span>
        </div>
      </foreignObject>
      <g role="list" aria-label="Contents of the response">
        <g role="listitem">
          <rect class="box-shaded" x="200" y="92" width="256" height="34" rx="5"/>
          <foreignObject x="200" y="92" width="256" height="34">
            <div xmlns="http://www.w3.org/1999/xhtml" class="area center">
              <span class="label sans size-11 primary">compaction block</span>
            </div>
          </foreignObject>
        </g>
      </g>
    </g>
    <g role="listitem">
      <foreignObject x="14" y="128.5" width="182" height="56.97">
        <div xmlns="http://www.w3.org/1999/xhtml" class="area start bottom">
          <span class="label sans size-11-5 weight-600 primary">Next request</span>
        </div>
      </foreignObject>
      <foreignObject x="14" y="179.5" width="182" height="34.5">
        <div xmlns="http://www.w3.org/1999/xhtml" class="area start top">
          <span class="label sans size-10 italic secondary">block first</span>
        </div>
      </foreignObject>
      <g role="list" aria-label="Contents of the next request">
        <g role="listitem">
          <rect class="box-shaded" x="200" y="164" width="256" height="34" rx="5"/>
          <foreignObject x="200" y="164" width="256" height="34">
            <div xmlns="http://www.w3.org/1999/xhtml" class="area center">
              <span class="label sans size-11 primary">compaction block</span>
            </div>
          </foreignObject>
        </g>
        <g role="listitem">
          <rect class="box" x="464" y="164" width="58" height="34" rx="5"/>
          <foreignObject x="464" y="164" width="58" height="34">
            <div xmlns="http://www.w3.org/1999/xhtml" class="area center">
              <span class="label sans size-11 primary" translate="no">user 3</span>
            </div>
          </foreignObject>
        </g>
      </g>
    </g>
  </g>
  <line class="arrow" x1="328" y1="60" x2="328" y2="86" marker-end="url(#arrow)" aria-hidden="true"/>
</svg>
