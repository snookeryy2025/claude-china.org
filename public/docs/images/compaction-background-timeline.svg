<svg lang="en" width="830" height="234" viewBox="0 0 830 234" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Background compaction timeline: the compaction request is sent with messages 1 to 5 while the conversation continues on its full history and gains messages 6 to 8; when the block arrives, it replaces messages 1 to 5 at the front of the history, and the history becomes the block followed by messages 6 to 8">
  <style>
    .sans { font-family: var(--cds-font-sans, "Anthropic Sans", system-ui, -apple-system, "PingFang SC", "PingFang TC", "Hiragino Sans", "Apple SD Gothic Neo", sans-serif); }
    /* Colors: the docs theme's CSS variables when the page inlines this diagram; the light values otherwise */
    .canvas { fill: var(--cds-surface-1, #fcfcfb); }
    .ink { fill: var(--cds-text-primary, #0b0b0b); }
    .box { fill: var(--cds-surface-2, #ffffff); stroke: var(--cds-border-stronger, #9c9c9b); stroke-width: 1.5; }
    .box-shaded { fill: var(--cds-alpha-2, #e4e4e3); stroke: var(--cds-border-stronger, #9c9c9b); stroke-width: 1.5; }
    .arrow { fill: none; stroke: var(--cds-text-secondary, #52514e); stroke-width: 1.5; }
    .arrow-head { fill: var(--cds-text-secondary, #52514e); }
    /* Labels are HTML text in an area, so that a longer translation wraps inside it */
    :where(foreignObject) { overflow: visible; }
    .area { box-sizing: border-box; width: 100%; height: 100%; display: flex; align-items: center; padding: 4px 6px; }
    .area.center { justify-content: center; text-align: center; }
    .area.start { justify-content: flex-start; text-align: start; }
    .area.top { align-items: flex-start; }
    .area.bottom { align-items: flex-end; }
    .label { line-height: 1.3; overflow-wrap: anywhere; }
    /* Only translations hyphenate, and only words of 10 or more letters, with 5 on each side of the hyphen. They also try to avoid a single word on their last line. A translated copy has its language on the root. */
    .label:not(:lang(en)) { hyphens: auto; hyphenate-limit-chars: 10 5 5; -webkit-hyphenate-limit-before: 5; -webkit-hyphenate-limit-after: 5; }
    .label:not(:lang(en)):not(.balance) { text-wrap: pretty; }
    /* Firefox has no text-wrap: pretty. There a translation balances its lines instead, which also keeps a single word off its last line, and has no automatic hyphens. */
    @supports not (text-wrap: pretty) { .label:not(:lang(en)) { hyphens: manual; } .label:not(:lang(en)):not(.balance) { text-wrap: balance; } }
    .label .mono, .label .code { hyphens: none; overflow-wrap: normal; }
    /* Chinese, Japanese and Korean labels break lines only at spaces and punctuation, and at the zero-width spaces that the docs translator adds to Chinese and Japanese text */
    .label:is(:lang(ja), :lang(ko), :lang(zh)) { word-break: keep-all; }
    /* Chinese, Japanese and Korean fonts have no italics, so the browser would slant the glyphs. This overrides the diagram's italic classes. */
    :is(:lang(ja), :lang(ko), :lang(zh)) { font-style: normal !important; }
    /* Type and colors of the labels */
    /* Bold text sets its weight axis too: in dark mode the page sets "wght" 360, which this text inherits and which overrides font-weight */
    .row-name { font-size: 11.5px; font-weight: 600; font-variation-settings: var(--cds-font-wght-bold, normal); }
    .row-note { font-size: 10px; }
    .box-label { font-size: 11px; }
    .block-label { font-size: 9.5px; }
    .italic { font-style: italic; }
    .label.ink { color: var(--cds-text-primary, #0b0b0b); }
    .label.muted { color: var(--cds-text-secondary, #52514e); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 6" markerWidth="10" markerHeight="6" refX="10" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <polygon class="arrow-head" points="0 0, 10 3, 0 6"/>
    </marker>
  </defs>
  <rect class="canvas" width="830" height="234" rx="6" aria-hidden="true"/>
  <g role="list" aria-label="The message history at three moments">
    <g role="listitem">
      <foreignObject x="14" y="4" width="181.3" height="37.9">
        <div xmlns="http://www.w3.org/1999/xhtml" class="area start bottom">
          <span class="label sans row-name ink">Request sent</span>
        </div>
      </foreignObject>
      <foreignObject x="14" y="35.5" width="181.3" height="36.3">
        <div xmlns="http://www.w3.org/1999/xhtml" class="area start top">
          <span class="label sans row-note italic muted">messages 1–5</span>
        </div>
      </foreignObject>
      <g role="list" aria-label="Messages of the request">
        <g role="listitem">
          <rect class="box" x="200" y="20" width="40" height="34" rx="5"/>
          <text x="220" y="37" text-anchor="middle" dominant-baseline="central" class="sans ink" font-size="11">1</text>
        </g>
        <g role="listitem">
          <rect class="box" x="248" y="20" width="40" height="34" rx="5"/>
          <text x="268" y="37" text-anchor="middle" dominant-baseline="central" class="sans ink" font-size="11">2</text>
        </g>
        <g role="listitem">
          <rect class="box" x="296" y="20" width="40" height="34" rx="5"/>
          <text x="316" y="37" text-anchor="middle" dominant-baseline="central" class="sans ink" font-size="11">3</text>
        </g>
        <g role="listitem">
          <rect class="box" x="344" y="20" width="40" height="34" rx="5"/>
          <text x="364" y="37" text-anchor="middle" dominant-baseline="central" class="sans ink" font-size="11">4</text>
        </g>
        <g role="listitem">
          <rect class="box" x="392" y="20" width="40" height="34" rx="5"/>
          <text x="412" y="37" text-anchor="middle" dominant-baseline="central" class="sans ink" font-size="11">5</text>
        </g>
      </g>
    </g>
    <g role="listitem">
      <foreignObject x="14" y="75.8" width="181.3" height="38.2">
        <div xmlns="http://www.w3.org/1999/xhtml" class="area start bottom">
          <span class="label sans row-name ink">While it runs</span>
        </div>
      </foreignObject>
      <foreignObject x="14" y="107.5" width="181.3" height="44.3">
        <div xmlns="http://www.w3.org/1999/xhtml" class="area start top">
          <span class="label sans row-note italic muted">6–8 arrive</span>
        </div>
      </foreignObject>
      <g role="list" aria-label="History while the request runs">
        <g role="listitem">
          <rect class="box" x="200" y="92" width="40" height="34" rx="5"/>
          <text x="220" y="109" text-anchor="middle" dominant-baseline="central" class="sans ink" font-size="11">1</text>
        </g>
        <g role="listitem">
          <rect class="box" x="248" y="92" width="40" height="34" rx="5"/>
          <text x="268" y="109" text-anchor="middle" dominant-baseline="central" class="sans ink" font-size="11">2</text>
        </g>
        <g role="listitem">
          <rect class="box" x="296" y="92" width="40" height="34" rx="5"/>
          <text x="316" y="109" text-anchor="middle" dominant-baseline="central" class="sans ink" font-size="11">3</text>
        </g>
        <g role="listitem">
          <rect class="box" x="344" y="92" width="40" height="34" rx="5"/>
          <text x="364" y="109" text-anchor="middle" dominant-baseline="central" class="sans ink" font-size="11">4</text>
        </g>
        <g role="listitem">
          <rect class="box" x="392" y="92" width="40" height="34" rx="5"/>
          <text x="412" y="109" text-anchor="middle" dominant-baseline="central" class="sans ink" font-size="11">5</text>
        </g>
        <g role="listitem">
          <rect class="box" x="440" y="92" width="40" height="34" rx="5"/>
          <text x="460" y="109" text-anchor="middle" dominant-baseline="central" class="sans ink" font-size="11">6</text>
        </g>
        <g role="listitem">
          <rect class="box" x="488" y="92" width="40" height="34" rx="5"/>
          <text x="508" y="109" text-anchor="middle" dominant-baseline="central" class="sans ink" font-size="11">7</text>
        </g>
        <g role="listitem">
          <rect class="box" x="536" y="92" width="40" height="34" rx="5"/>
          <text x="556" y="109" text-anchor="middle" dominant-baseline="central" class="sans ink" font-size="11">8</text>
        </g>
      </g>
      <g role="list" aria-label="In the background">
        <g role="listitem">
          <rect class="box-shaded" x="200" y="132" width="232" height="14" rx="3"/>
          <foreignObject x="200" y="128.3" width="232" height="21.4">
            <div xmlns="http://www.w3.org/1999/xhtml" class="area center">
              <span class="label sans block-label muted">compaction request: 1–5</span>
            </div>
          </foreignObject>
          <line class="arrow" x1="436" y1="139" x2="576" y2="139" marker-end="url(#arrow)" aria-hidden="true"/>
        </g>
      </g>
    </g>
    <g role="listitem">
      <foreignObject x="14" y="155.8" width="181.3" height="46.2">
        <div xmlns="http://www.w3.org/1999/xhtml" class="area start bottom">
          <span class="label sans row-name ink">After the swap</span>
        </div>
      </foreignObject>
      <foreignObject x="14" y="195.5" width="181.3" height="34.5">
        <div xmlns="http://www.w3.org/1999/xhtml" class="area start top">
          <span class="label sans row-note italic muted">block, then 6–8</span>
        </div>
      </foreignObject>
      <g role="list" aria-label="History after the swap">
        <g role="listitem">
          <rect class="box-shaded" x="200" y="180" width="232" height="34" rx="5"/>
          <foreignObject x="200" y="180" width="232" height="34">
            <div xmlns="http://www.w3.org/1999/xhtml" class="area center">
              <span class="label sans box-label ink">compaction block</span>
            </div>
          </foreignObject>
        </g>
        <g role="listitem">
          <rect class="box" x="440" y="180" width="40" height="34" rx="5"/>
          <text x="460" y="197" text-anchor="middle" dominant-baseline="central" class="sans ink" font-size="11">6</text>
        </g>
        <g role="listitem">
          <rect class="box" x="488" y="180" width="40" height="34" rx="5"/>
          <text x="508" y="197" text-anchor="middle" dominant-baseline="central" class="sans ink" font-size="11">7</text>
        </g>
        <g role="listitem">
          <rect class="box" x="536" y="180" width="40" height="34" rx="5"/>
          <text x="556" y="197" text-anchor="middle" dominant-baseline="central" class="sans ink" font-size="11">8</text>
        </g>
      </g>
    </g>
  </g>
</svg>
