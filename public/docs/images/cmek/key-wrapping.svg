<svg lang="en" width="800" height="280" viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Your key stays in your cloud's KMS and wraps Anthropic's data keys, which encrypt your data. Your cloud can log each call.">
  <style>
    /* Type: the page's fonts when the page inlines this diagram; the listed fallbacks otherwise, for example in a code review */
    .sans { font-family: var(--cds-font-sans, "Anthropic Sans", system-ui, -apple-system, "PingFang SC", "PingFang TC", "Hiragino Sans", "Apple SD Gothic Neo", sans-serif); }
    .t15 { font-size: 15px; }
    .t14 { font-size: 14px; }
    .t13 { font-size: 13px; }
    .t12 { font-size: 12px; }
    /* Bold text sets its weight axis too: in dark mode the page sets "wght" 360, which this text inherits and which overrides font-weight */
    .bold { font-weight: 600; font-variation-settings: var(--cds-font-wght-bold, normal); }
    /* Colors: the docs theme's CSS variables when the page inlines this diagram; the light values otherwise */
    .canvas { fill: var(--cds-surface-1, #fcfcfb); }
    .box { fill: var(--cds-surface-2, #ffffff); stroke: var(--cds-border-stronger, #0b0b0b66); stroke-width: 1.5; }
    /* The reader's side: a solid outline in the second-actor tint */
    .region-yours { fill: var(--cds-bg-pro, #dfdbfd); fill-opacity: 0.3; stroke: var(--cds-fill-pro, #7161e0); stroke-width: 1.5; }
    /* Anthropic's side: a dashed clay outline */
    .region-anthropic { fill: var(--cds-bg-tint-orange-opaque, #f7d8cb); fill-opacity: 0.3; stroke: var(--cds-clay, #d97757); stroke-width: 1.5; stroke-dasharray: 6 4; }
    .edge { fill: none; stroke: var(--cds-text-secondary, #52514e); stroke-width: 1.5; }
    .edge.thin { stroke-width: 1; }
    .tip { fill: var(--cds-text-secondary, #52514e); }
    /* Labels are HTML text in an area, so that a longer translation wraps inside it */
    :where(foreignObject) { overflow: visible; }
    .area { box-sizing: border-box; width: 100%; height: 100%; display: flex; align-items: center; padding: 4px 6px; }
    .area.center { justify-content: center; text-align: center; }
    .area.start { justify-content: flex-start; text-align: start; }
    .area.end { justify-content: flex-end; text-align: end; }
    .area.top { align-items: flex-start; }
    .area.bottom { align-items: flex-end; }
    .label { line-height: 1.3; overflow-wrap: anywhere; }
    .label:not(:lang(en)) { hyphens: auto; hyphenate-limit-chars: 10 5 5; -webkit-hyphenate-limit-before: 5; -webkit-hyphenate-limit-after: 5; }
    .label:not(:lang(en)):not(.balance) { text-wrap: pretty; }
    /* Firefox has no text-wrap: pretty. There a translation balances its lines instead, which also keeps a single word off its last line, and has no automatic hyphens. */
    @supports not (text-wrap: pretty) { .label:not(:lang(en)) { hyphens: manual; } .label:not(:lang(en)):not(.balance) { text-wrap: balance; } }
    .label .mono, .label .code, .label code { hyphens: none; overflow-wrap: normal; }
    .label code { color: inherit; background: none; border: 0; border-radius: 0; padding: 0; white-space: inherit; }
    .label:is(:lang(ja), :lang(ko), :lang(zh)) { word-break: keep-all; }
    :is(:lang(ja), :lang(ko), :lang(zh)) { font-style: normal !important; }
    /* Labels stacked in one area, so that a label that wraps pushes the next one down */
    .area.column { flex-direction: column; gap: 2px; }
    .label.primary { color: var(--cds-text-primary, #0b0b0b); }
    .label.secondary { color: var(--cds-text-secondary, #52514e); }
    .label.pro { color: var(--cds-text-pro, #4a3aa7); }
    .label.orange { color: var(--cds-text-tint-orange, #863311); }
  </style>
  <defs>
    <marker id="key-wrapping-arrow" viewBox="0 0 10 6" markerWidth="10" markerHeight="6" refX="10" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <polygon class="tip" points="0 0, 10 3, 0 6"/>
    </marker>
  </defs>
  <rect class="canvas" width="800" height="280" rx="6" aria-hidden="true"/>
  <g role="list" aria-label="Where each part lives">
    <g role="listitem">
      <rect class="region-yours" x="16" y="16" width="312" height="248" rx="6"/>
      <foreignObject x="26" y="22" width="292" height="34">
        <div xmlns="http://www.w3.org/1999/xhtml" class="area start">
          <span class="label sans t15 bold pro">Your cloud</span>
        </div>
      </foreignObject>
      <g role="list" aria-label="In your cloud">
        <g role="listitem">
          <rect class="box" x="64" y="64" width="216" height="64" rx="6"/>
          <foreignObject x="64" y="64" width="216" height="64">
            <div xmlns="http://www.w3.org/1999/xhtml" class="area center column">
              <span class="label sans t14 primary">Your key</span>
              <span class="label sans t12 secondary">in your KMS</span>
            </div>
          </foreignObject>
        </g>
        <g role="listitem">
          <rect class="box" x="64" y="200" width="216" height="48" rx="6"/>
          <foreignObject x="64" y="200" width="216" height="48">
            <div xmlns="http://www.w3.org/1999/xhtml" class="area center">
              <span class="label sans t14 primary">Audit log</span>
            </div>
          </foreignObject>
        </g>
      </g>
    </g>
    <g role="listitem">
      <rect class="region-anthropic" x="472" y="16" width="312" height="248" rx="6"/>
      <foreignObject x="482" y="22" width="292" height="34">
        <div xmlns="http://www.w3.org/1999/xhtml" class="area start">
          <span class="label sans t15 bold orange" translate="no">Anthropic</span>
        </div>
      </foreignObject>
      <g role="list" aria-label="At Anthropic">
        <g role="listitem">
          <rect class="box" x="520" y="64" width="216" height="64" rx="6"/>
          <foreignObject x="520" y="64" width="216" height="64">
            <div xmlns="http://www.w3.org/1999/xhtml" class="area center">
              <span class="label sans t14 primary">Data keys</span>
            </div>
          </foreignObject>
        </g>
        <g role="listitem">
          <rect class="box" x="520" y="200" width="216" height="48" rx="6"/>
          <foreignObject x="520" y="200" width="216" height="48">
            <div xmlns="http://www.w3.org/1999/xhtml" class="area center">
              <span class="label sans t14 primary">Your stored data</span>
            </div>
          </foreignObject>
        </g>
      </g>
    </g>
  </g>
  <g role="list" aria-label="What moves between them">
    <g role="listitem">
      <foreignObject x="332" y="20" width="136" height="72">
        <div xmlns="http://www.w3.org/1999/xhtml" class="area center bottom">
          <span class="label sans t13 secondary">wraps and unwraps</span>
        </div>
      </foreignObject>
      <line class="edge" x1="280" y1="96" x2="520" y2="96" marker-end="url(#key-wrapping-arrow)" role="img" aria-label="From your key to the data keys"/>
    </g>
    <g role="listitem">
      <foreignObject x="636" y="132" width="140" height="64">
        <div xmlns="http://www.w3.org/1999/xhtml" class="area start">
          <span class="label sans t13 secondary">encrypt and decrypt</span>
        </div>
      </foreignObject>
      <line class="edge" x1="628" y1="128" x2="628" y2="200" marker-end="url(#key-wrapping-arrow)" role="img" aria-label="From the data keys to your stored data"/>
    </g>
    <g role="listitem">
      <foreignObject x="180" y="132" width="140" height="64">
        <div xmlns="http://www.w3.org/1999/xhtml" class="area start">
          <span class="label sans t13 secondary">calls can be logged</span>
        </div>
      </foreignObject>
      <line class="edge thin" x1="172" y1="128" x2="172" y2="200" marker-end="url(#key-wrapping-arrow)" role="img" aria-label="From your key to the audit log"/>
    </g>
  </g>
</svg>
