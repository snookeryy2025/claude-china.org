    .box-invalid { fill: var(--cds-bg-danger, #fad6d6); stroke: var(--cds-text-danger, #8e2626); stroke-width: 1.5; stroke-dasharray: 3 2; }
    .box-may { fill: var(--cds-surface-2, #ffffff); stroke: var(--cds-text-success, #006300); stroke-width: 1.75; }
    .box-unread { fill: var(--cds-surface-2, #ffffff); stroke: var(--cds-text-secondary, #52514e); stroke-width: 1.5; stroke-dasharray: 3 2; }
    .mark-valid { fill: none; stroke: var(--cds-text-success, #006300); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .mark-invalid { fill: none; stroke: var(--cds-text-danger, #8e2626); stroke-width: 2; stroke-linecap: round; }
    .mark-unread { fill: none; stroke: var(--cds-text-secondary, #52514e); stroke-width: 2; stroke-linecap: round; }
    .rule { stroke: var(--cds-border-stronger, #9c9c9b); stroke-width: 1; stroke-dasharray: 2 3; }
    .ink { fill: var(--cds-text-primary, #0b0b0b); }
    .muted { fill: var(--cds-text-secondary, #52514e); }
    .accent { fill: var(--cds-text-accent, #1f5fa8); }
    .valid { fill: var(--cds-text-success, #006300); }
    .invalid { fill: var(--cds-text-danger, #8e2626); }
    .middle { text-anchor: middle; }
    /* Labels are HTML text in an area, so that a longer translation wraps inside it */
    :where(foreignObject) { overflow: visible; }
    .area { box-sizing: border-box; width: 100%; height: 100%; display: flex; align-items: center; padding: 2px 2px; }
    .area.center { justify-content: center; text-align: center; }
    .area.start { justify-content: flex-start; text-align: start; }
    .area.end { justify-content: flex-end; text-align: end; }
    .area.top { align-items: flex-start; }
    .area.bottom { align-items: flex-end; }
    .label { line-height: 1.25; overflow-wrap: anywhere; }
    /* Only translations hyphenate, and only words of 10 or more letters, with 5 on each side of the hyphen. They also try to avoid a single word on their last line. A translated copy has its language on the root. */
    .label:not(:lang(en)) { hyphens: auto; hyphenate-limit-chars: 10 5 5; -webkit-hyphenate-limit-before: 5; -webkit-hyphenate-limit-after: 5; }
    .label:not(:lang(en)):not(.balance) { text-wrap: pretty; }
    .label .mono, .label .code, .label code { hyphens: none; overflow-wrap: normal; }
    .label code { font-family: var(--cds-font-mono, "Anthropic Mono", ui-monospace, monospace); font-size: 0.92em; line-height: inherit; color: inherit; background: none; border: 0; border-radius: 0; padding: 0; white-space: inherit; }
    .label:is(:lang(ja), :lang(ko), :lang(zh)) { word-break: keep-all; }
    :is(:lang(ja), :lang(ko), :lang(zh)) { font-style: normal !important; }
    /* Sizes and weights. Bold text sets its weight axis too: in dark mode the page sets "wght" 360, which this text inherits and which overrides font-weight */
    .title { font-size: 15px; font-weight: 600; font-variation-settings: var(--cds-font-wght-bold, normal); }
    .note { font-size: 13.5px; }
    .small { font-size: 13px; }
    .strong { font-weight: 600; font-variation-settings: var(--cds-font-wght-bold, normal); }
    .label.ink { color: var(--cds-text-primary, #0b0b0b); }
    .label.muted { color: var(--cds-text-secondary, #52514e); }
    .label.accent { color: var(--cds-text-accent, #1f5fa8); }
    .label.valid { color: var(--cds-text-success, #006300); }
    .label.invalid { color: var(--cds-text-danger, #8e2626); }
